<text x="20.0" y="18" font-size="5" font-weight="bold">goa console: frame rail, 2 off</text>
<text x="20.0" y="27.0">Top face (panel screws): 30 x M3, tap drill 2.5 x 8, thread 6 deep, on the centre line</text>
<text x="20.0" y="57.0">Side face: M4 tapped through at mid-length, mid-height (bond). Ends: 2 x M4 x 10 at z 12.5 / 37.5 (cheek fixing)</text>
