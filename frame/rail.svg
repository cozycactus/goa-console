<text x="20.0" y="18" font-size="5" font-weight="bold">goa console: frame rails, front 1 off (no slots), back 1 off (vent slots)</text>
<text x="20.0" y="27.0">Top face (panel screws): 30 x M3, tap drill 2.5 x 8, thread 6 deep, on the centre line</text>
<text x="20.0" y="57.0">Back rail only: 30 vent slots 30 x 25 (R3) through, centred 25 below the top. Both: ends 2 x M4 x 10 at z 12.5 / 37.5; M4 x 8 bond in the bottom face</text>
<text x="20.0" y="82.28571428571428">6060-T6 or 6082 aluminium flat bar 50 x 10, mill finish (or clear anodised, holes tapped after). Length 1227.2 mm. Section 10 x 50 on edge. Hole positions +-0.15 mm. Scale 1:3.5.</text>
<text x="20.0" y="88.28571428571428">Panel screw holes, x from the left end (mm):</text>
<text x="20.0" y="94.28571428571428">10.35   50.99   91.63   132.27   172.91   213.55   254.19   294.83   335.47   376.11</text>
<text x="20.0" y="99.28571428571428">416.75   457.39   498.03   538.67   579.31   645.25   660.59   701.23   741.87   782.51</text>
<text x="20.0" y="104.28571428571428">823.15   863.79   904.43   945.07   985.71   1026.35   1066.99   1107.63   1148.27   1188.91</text>
<text x="20.0" y="114.28571428571428">Back rail vent slots (thermal_study.md TH1): 30 x 30 x 25 mm, centres from 40.00 to 1187.20 at 39.56 mm pitch; bond hole at 613.60 in the gap at mid-length.</text>
